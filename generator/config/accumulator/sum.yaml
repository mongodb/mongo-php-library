# $schema: ../schema.json
name: $sum
link: https://www.mongodb.com/docs/manual/reference/operator/aggregation/sum/
type:
    - accumulator
    - window
encode: single
description: |
    Returns a sum of numerical values. Ignores non-numeric values.
    Changed in MongoDB 5.0: Available in the $setWindowFields stage.
arguments:
    - name: expression
      type:
          - resolvesToNumber
tests:
    - name: Use in $group Stage
      link: https://www.mongodb.com/docs/manual/reference/operator/aggregation/sum/#use-in--group-stage
      pipeline:
          - $group:
                _id:
                    day:
                        $dayOfYear:
                            date: $date
                    year:
                        $year:
                            date: $date
                totalAmount:
                    $sum:
                        $multiply:
                            - $price
                            - $quantity
                count:
                    $sum: 1
      schema:
          sales:
              _id:
                  types:
                      - bsonType: Number
              item:
                  types:
                      - bsonType: String
              price:
                  types:
                      - bsonType: Number
              quantity:
                  types:
                      - bsonType: Number
              date:
                  types:
                      - bsonType: Date
    - name: Use in $setWindowFields Stage
      link: https://www.mongodb.com/docs/manual/reference/operator/aggregation/sum/#use-in--setwindowfields-stage
      pipeline:
          - $setWindowFields:
                partitionBy: $state
                sortBy:
                    orderDate: 1
                output:
                    sumQuantityForState:
                        $sum: $quantity
                        window:
                            documents:
                                - unbounded
                                - current
      schema:
          cakeSales:
              _id:
                  types:
                      - bsonType: Number
              type:
                  types:
                      - bsonType: String
              orderDate:
                  types:
                      - bsonType: Date
              state:
                  types:
                      - bsonType: String
              price:
                  types:
                      - bsonType: Number
              quantity:
                  types:
                      - bsonType: Number
