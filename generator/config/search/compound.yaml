# $schema: ../schema.json
name: compound
link: https://www.mongodb.com/docs/atlas/atlas-search/compound/
type:
    - searchOperator
encode: object
description: |
    The compound operator combines two or more operators into a single query.
    Each element of a compound query is called a clause, and each clause
    consists of one or more sub-queries.
arguments:
    - name: must
      optional: true
      type:
          - searchOperator
          - array
    - name: mustNot
      optional: true
      type:
          - searchOperator
          - array
    - name: should
      optional: true
      type:
          - searchOperator
          - array
    - name: filter
      optional: true
      type:
          - searchOperator
          - array
    - name: minimumShouldMatch
      optional: true
      type:
          - int
    - name: score
      optional: true
      type:
          - searchScore
tests:
    - name: must and mustNot
      link: https://www.mongodb.com/docs/atlas/atlas-search/compound/#must-and-mustnot-example
      pipeline:
          - $search:
                compound:
                    must:
                        - text:
                              query: varieties
                              path: description
                    mustNot:
                        - text:
                              query: apples
                              path: description
      schema:
          TestCollection:
              _id:
                  types:
                      - bsonType: Number
              type:
                  types:
                      - bsonType: String
              description:
                  types:
                      - bsonType: String
              category:
                  types:
                      - bsonType: String
              in_stock:
                  types:
                      - bsonType: Boolean
    - name: must and should
      link: https://www.mongodb.com/docs/atlas/atlas-search/compound/#must-and-should-example
      pipeline:
          - $search:
                compound:
                    must:
                        - text:
                              query: varieties
                              path: description
                    should:
                        - text:
                              query: Fuji
                              path: description
          - $project:
                score:
                    $meta: searchScore
      schema:
          TestCollection:
              _id:
                  types:
                      - bsonType: Number
              type:
                  types:
                      - bsonType: String
              description:
                  types:
                      - bsonType: String
              category:
                  types:
                      - bsonType: String
              in_stock:
                  types:
                      - bsonType: Boolean
    - name: minimumShouldMatch
      link: https://www.mongodb.com/docs/atlas/atlas-search/compound/#minimumshouldmatch-example
      pipeline:
          - $search:
                compound:
                    must:
                        - text:
                              query: varieties
                              path: description
                    should:
                        - text:
                              query: Fuji
                              path: description
                        - text:
                              query: Golden Delicious
                              path: description
                    minimumShouldMatch: 1
      schema:
          TestCollection:
              _id:
                  types:
                      - bsonType: Number
              type:
                  types:
                      - bsonType: String
              description:
                  types:
                      - bsonType: String
              category:
                  types:
                      - bsonType: String
              in_stock:
                  types:
                      - bsonType: Boolean
    - name: Filter
      link: https://www.mongodb.com/docs/atlas/atlas-search/compound/#filter-examples
      pipeline:
          - $search:
                compound:
                    must:
                        - text:
                              query: varieties
                              path: description
                    should:
                        - text:
                              query: banana
                              path: description
                    filter:
                        - text:
                              query: granny
                              path: description
      schema:
          TestCollection:
              _id:
                  types:
                      - bsonType: Number
              type:
                  types:
                      - bsonType: String
              description:
                  types:
                      - bsonType: String
              category:
                  types:
                      - bsonType: String
              in_stock:
                  types:
                      - bsonType: Boolean
    - name: Nested
      link: https://www.mongodb.com/docs/atlas/atlas-search/compound/#nested-example
      pipeline:
          - $search:
                compound:
                    should:
                        - text:
                              query: apple
                              path: type
                        - compound:
                              must:
                                  - text:
                                        query: organic
                                        path: category
                                  - equals:
                                        value: true
                                        path: in_stock
                    minimumShouldMatch: 1
      schema:
          TestCollection:
              _id:
                  types:
                      - bsonType: Number
              type:
                  types:
                      - bsonType: String
              description:
                  types:
                      - bsonType: String
              category:
                  types:
                      - bsonType: String
              in_stock:
                  types:
                      - bsonType: Boolean
