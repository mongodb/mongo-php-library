name: "Generator"

on:
  merge_group:
  pull_request:
    branches:
      - "v*.*"
      - "feature/*"
  push:
    branches:
      - "v*.*"
      - "feature/*"

env:
  PHP_VERSION: "8.2"

jobs:
  diff:
    name: "Diff check"
    runs-on: "ubuntu-24.04"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          submodules: true

      - name: "Setup"
        uses: "./.github/actions/setup"
        with:
          php-version: ${{ env.PHP_VERSION }}
          working-directory: "generator"

      - name: "Run Generator"
        run: "generator/generate"

      - name: "Check file diff"
        run: git add . -N && git diff --exit-code

  evergreen-config:
    name: "Evergreen config diff check"
    runs-on: "ubuntu-24.04"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: "Generate Evergreen config"
        run: "php .evergreen/config/generate-config.php"

      - name: "Check file diff"
        run: git add .evergreen/config/generated -N && git diff --exit-code .evergreen/config/generated
