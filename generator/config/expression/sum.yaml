# $schema: ../schema.json
name: $sum
link: https://www.mongodb.com/docs/manual/reference/operator/aggregation/sum/
type:
    - resolvesToNumber
encode: single
description: |
    Returns a sum of numerical values. Ignores non-numeric values.
    Changed in MongoDB 5.0: Available in the $setWindowFields stage.
arguments:
    - name: expression
      type:
          - resolvesToNumber
          - resolvesToArray
      variadic: array
tests:
    - name: Use in $project Stage
      link: https://www.mongodb.com/docs/manual/reference/operator/aggregation/sum/#use-in--project-stage
      pipeline:
          - $project:
                quizTotal:
                    $sum:
                        - $quizzes
                labTotal:
                    $sum:
                        - $labs
                examTotal:
                    $sum:
                        - $final
                        - $midterm
      schema:
          TestCollection:
              _id:
                  types:
                      - bsonType: Number
              quizzes:
                  types:
                      - bsonType: Array
                        types:
                            - bsonType: Number
              labs:
                  types:
                      - bsonType: Array
                        types:
                            - bsonType: Number
              final:
                  types:
                      - bsonType: Number
              midterm:
                  types:
                      - bsonType: Number
