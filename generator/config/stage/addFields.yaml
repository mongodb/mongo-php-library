# $schema: ../schema.json
name: $addFields
link: https://www.mongodb.com/docs/manual/reference/operator/aggregation/addFields/
type:
    - stage
encode: single
description: |
    Adds new fields to documents. Outputs documents that contain all existing fields from the input documents and newly added fields.
arguments:
    - name: expression
      type:
          - expression
      variadic: object
      description: |
          Specify the name of each field to add and set its value to an aggregation expression or an empty object.
tests:
    - name: Using Two $addFields Stages
      link: https://www.mongodb.com/docs/manual/reference/operator/aggregation/addFields/#using-two--addfields-stages
      pipeline:
          - $addFields:
                totalHomework:
                    $sum:
                        - $homework
                totalQuiz:
                    $sum:
                        - $quiz
          - $addFields:
                totalScore:
                    $add:
                        - $totalHomework
                        - $totalQuiz
                        - $extraCredit
      schema:
          scores:
              _id:
                  types:
                      - bsonType: Number
              student:
                  types:
                      - bsonType: String
              homework:
                  types:
                      - bsonType: Array
                        types:
                            - bsonType: Number
              quiz:
                  types:
                      - bsonType: Array
                        types:
                            - bsonType: Number
              extraCredit:
                  types:
                      - bsonType: Number
    - name: Adding Fields to an Embedded Document
      link: https://www.mongodb.com/docs/manual/reference/operator/aggregation/addFields/#adding-fields-to-an-embedded-document
      pipeline:
          - $addFields:
                specs.fuel_type: unleaded
      schema:
          vehicles:
              _id:
                  types:
                      - bsonType: Number
              type:
                  types:
                      - bsonType: String
              specs:
                  types:
                      - bsonType: Document
                        fields:
                            doors:
                                types:
                                    - bsonType: Number
                            wheels:
                                types:
                                    - bsonType: Number
    - name: Overwriting an existing field
      link: https://www.mongodb.com/docs/manual/reference/operator/aggregation/addFields/#overwriting-an-existing-field
      pipeline:
          - $addFields:
                cats: 20
      schema:
          animals:
              _id:
                  types:
                      - bsonType: Number
              dogs:
                  types:
                      - bsonType: Number
              cats:
                  types:
                      - bsonType: Number
    - name: Add Element to an Array
      link: https://www.mongodb.com/docs/manual/reference/operator/aggregation/addFields/#add-element-to-an-array
      pipeline:
          - $match:
                _id: 1
          - $addFields:
                homework:
                    $concatArrays:
                        - $homework
                        -     - 7
      schema:
          scores:
              _id:
                  types:
                      - bsonType: Number
              student:
                  types:
                      - bsonType: String
              homework:
                  types:
                      - bsonType: Array
                        types:
                            - bsonType: Number
              quiz:
                  types:
                      - bsonType: Array
                        types:
                            - bsonType: Number
              extraCredit:
                  types:
                      - bsonType: Number
