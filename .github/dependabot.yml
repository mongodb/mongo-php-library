version: 2
updates:
  - package-ecosystem: "github-actions"
    target-branch: "v1.21"
    directory: "/"
    schedule:
      interval: "weekly"
    # Cooldown only applies to third-party actions. Actions owned by MongoDB
    # (mongodb-labs/*) are trusted and can be updated without delay.
    cooldown:
      default-days: 7
      exclude:
        - "mongodb-labs/*"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "gitsubmodule"
    target-branch: "v1.21"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "*drivers-evergreen-tools"
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "*specifications"
