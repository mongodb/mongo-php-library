name: "Submodule Validation"

on:
  merge_group:
  pull_request:
    branches:
      - "v*.*"
      - "feature/*"

jobs:
  validate-submodules:
    name: "Validate submodule references"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Validate submodule commits"
        uses: "mongodb-labs/drivers-github-tools/validate-submodules@99b1cbd729bc83bf7fc74e1b2a97fffad3d65d7b"  # v3.1.1
        with:
          token: ${{ github.token }}
