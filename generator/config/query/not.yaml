# $schema: ../schema.json
name: $not
link: https://www.mongodb.com/docs/manual/reference/operator/query/not/
type:
    - fieldQuery
encode: single
description: |
    Inverts the effect of a query expression and returns documents that do not match the query expression.
arguments:
    - name: expression
      type:
          - fieldQuery
tests:
    - name: Syntax
      link: https://www.mongodb.com/docs/manual/reference/operator/query/not/#syntax
      pipeline:
          - $match:
                price:
                    $not:
                        $gt: 1.99
      schema:
          inventory: &ref_0
              price:
                  types:
                      - bsonType: Double
              qty:
                  types:
                      - bsonType: Int32
                      - bsonType: Undefined
              sale:
                  types:
                      - bsonType: Boolean
    - name: Regular Expressions
      link: https://www.mongodb.com/docs/manual/reference/operator/query/not/#regular-expressions
      pipeline:
          - $match:
                price:
                    $not: !bson_regex ^p.*
      schema:
          inventory: *ref_0
