name: Setup
description: Sets up the build environment
inputs:
  php-version:
    description: "PHP version to install"
    required: true
  driver-version:
    description: "MongoDB extension version to install: \"stable\" for the highest version allowed by composer.json, \"lowest\" for the minimum required version"
    required: false
    default: "stable"
  php-ini-values:
    description: "INI values to pass along to setup-php action"
    required: false
    default: ""
  working-directory:
    description: "The directory where composer.json is located, if it is not in the repository root."
    required: false
  ignore-platform-req:
    description: "Whether to ignore platform requirements when installing dependencies with Composer."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve extension version
      id: driver
      shell: bash
      run: |
        source .extension-version

        TARGET="${{ inputs.driver-version }}"

        if [ "$EXTENSION_REQUIRE_NEXT_MINOR" = "true" ]; then
          TARGET="next-minor"
        fi

        case "$TARGET" in
          next-minor)
            # Source builds cannot be cached, and caching a moving branch under
            # a stable key would freeze an outdated extension.
            echo "version=mongodb/mongo-php-driver@${EXTENSION_NEXT_MINOR_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "cacheable=false" >> "$GITHUB_OUTPUT"
            ;;
          lowest | stable)
            WORKING_DIRECTORY="${{ inputs.working-directory }}"
            VERSION=$(python3 "$GITHUB_ACTION_PATH/extension-version.py" "$TARGET" "${WORKING_DIRECTORY:-.}/composer.json")

            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "expected=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "cacheable=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::Unsupported extension target: $TARGET"
            exit 1
            ;;
        esac

    - name: Setup cache environment
      id: extcache
      if: steps.driver.outputs.cacheable == 'true'
      uses: shivammathur/cache-extensions@v1
      with:
        php-version: ${{ inputs.php-version }}
        extensions: "mongodb-${{ steps.driver.outputs.version }}"
        # The requested extension version is part of the key computed by the
        # action. This value is only there to invalidate the cache by hand.
        key: "extcache-v1"

    - name: Cache extensions
      if: steps.driver.outputs.cacheable == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.extcache.outputs.dir }}
        key: ${{ steps.extcache.outputs.key }}
        restore-keys: ${{ steps.extcache.outputs.key }}

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        coverage: xdebug
        extensions: "mongodb-${{ steps.driver.outputs.version }}"
        php-version: "${{ inputs.php-version }}"
        tools: cs2pr
        ini-values: "${{ inputs.php-ini-values }}"

    - name: Show driver information
      run: "php --ri mongodb"
      shell: bash

    - name: Check the expected driver version is installed
      if: steps.driver.outputs.expected != ''
      shell: bash
      run: |
        INSTALLED=$(php -r 'echo phpversion("mongodb");')
        EXPECTED="${{ steps.driver.outputs.expected }}"

        if [ "$INSTALLED" != "$EXPECTED" ]; then
          echo "::error::Expected extension version $EXPECTED, got $INSTALLED"
          exit 1
        fi

    - name: Install dependencies with Composer
      uses: ramsey/composer-install@3.0.0
      with:
        composer-options: "--no-suggest ${{ inputs.ignore-platform-req == 'true' && '--ignore-platform-req=php+' || '' }}"
        working-directory: "${{ inputs.working-directory }}"
