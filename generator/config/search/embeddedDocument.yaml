# $schema: ../schema.json
name: embeddedDocument
link: https://www.mongodb.com/docs/atlas/atlas-search/embedded-document/
type:
    - searchOperator
encode: object
description: |
    The embeddedDocument operator is similar to $elemMatch operator.
    It constrains multiple query predicates to be satisfied from a single
    element of an array of embedded documents. embeddedDocument can be used only
    for queries over fields of the embeddedDocuments
arguments:
    - name: path
      type:
          - searchPath
    - name: operator
      type:
          - searchOperator
    - name: score
      optional: true
      type:
          - searchScore
tests:
    - name: Basic
      link: https://www.mongodb.com/docs/atlas/atlas-search/embedded-document/#index-definition
      pipeline:
          - $search:
                embeddedDocument:
                    path: items
                    operator:
                        compound:
                            must:
                                - text:
                                      path: items.tags
                                      query: school
                            should:
                                - text:
                                      path: items.name
                                      query: backpack
                    score:
                        embedded:
                            aggregate: mean
          - $limit: 5
          - $project:
                _id: 0
                items.name: 1
                items.tags: 1
                score:
                    $meta: searchScore
      schema:
          sales: &ref_0
              _id:
                  types:
                      - bsonType: Document
                        fields:
                            $oid:
                                types:
                                    - bsonType: String
              saleDate:
                  types:
                      - bsonType: Document
                        fields:
                            $date:
                                types:
                                    - bsonType: Document
                                      fields:
                                          $numberLong:
                                              types:
                                                  - bsonType: String
              items:
                  types:
                      - bsonType: Array
                        types:
                            - bsonType: Document
                              fields:
                                  name:
                                      types:
                                          - bsonType: String
                                  tags:
                                      types:
                                          - bsonType: Array
                                            types:
                                                - bsonType: String
                                  price:
                                      types:
                                          - bsonType: Document
                                            fields:
                                                $numberDecimal:
                                                    types:
                                                        - bsonType: String
                                  quantity:
                                      types:
                                          - bsonType: Document
                                            fields:
                                                $numberInt:
                                                    types:
                                                        - bsonType: String
              storeLocation:
                  types:
                      - bsonType: String
              customer:
                  types:
                      - bsonType: Document
                        fields:
                            gender:
                                types:
                                    - bsonType: String
                            age:
                                types:
                                    - bsonType: Document
                                      fields:
                                          $numberInt:
                                              types:
                                                  - bsonType: String
                            email:
                                types:
                                    - bsonType: String
                            satisfaction:
                                types:
                                    - bsonType: Document
                                      fields:
                                          $numberInt:
                                              types:
                                                  - bsonType: String
              couponUsed:
                  types:
                      - bsonType: Boolean
              purchaseMethod:
                  types:
                      - bsonType: String
    - name: Facet
      link: https://www.mongodb.com/docs/atlas/atlas-search/embedded-document/#facet-query
      pipeline:
          - $searchMeta:
                facet:
                    operator:
                        embeddedDocument:
                            path: items
                            operator:
                                compound:
                                    must:
                                        - text:
                                              path: items.tags
                                              query: school
                                    should:
                                        - text:
                                              path: items.name
                                              query: backpack
                    facets:
                        purchaseMethodFacet:
                            type: string
                            path: purchaseMethod
      schema:
          sales: *ref_0
    - name: Query and Sort
      link: https://www.mongodb.com/docs/atlas/atlas-search/embedded-document/#query-and-sort
      pipeline:
          - $search:
                embeddedDocument:
                    path: items
                    operator:
                        text:
                            path: items.name
                            query: laptop
                sort:
                    items.tags: 1
          - $limit: 5
          - $project:
                _id: 0
                items.name: 1
                items.tags: 1
                score:
                    $meta: searchScore
      schema:
          sales: *ref_0
    - name: Query for Matching Embedded Documents Only
      link: https://www.mongodb.com/docs/atlas/atlas-search/embedded-document/#query-for-matching-embedded-documents-only
      pipeline:
          - $search:
                embeddedDocument:
                    path: items
                    operator:
                        compound:
                            must:
                                - range:
                                      path: items.quantity
                                      gt: 2
                                - exists:
                                      path: items.price
                                - text:
                                      path: items.tags
                                      query: school
          - $limit: 2
          - $project:
                _id: 0
                storeLocation: 1
                items:
                    $filter:
                        input: $items
                        cond:
                            $and:
                                - $ifNull:
                                      - $$this.price
                                      - 'false'
                                - $gt:
                                      - $$this.quantity
                                      - 2
                                - $in:
                                      - office
                                      - $$this.tags
      schema:
          sales: *ref_0
