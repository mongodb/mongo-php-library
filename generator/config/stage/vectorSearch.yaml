# $schema: ../schema.json
name: $vectorSearch
link: https://www.mongodb.com/docs/atlas/atlas-vector-search/vector-search-stage/
type:
    - stage
encode: object
description: |
    The $vectorSearch stage performs an ANN or ENN search on a vector in the specified field.
arguments:
    - name: index
      type:
          - string
      description: |
          Name of the Atlas Vector Search index to use.
    - name: limit
      type:
          - int
      description: |
          Number of documents to return in the results. This value can't exceed the value of numCandidates if you specify numCandidates.
    - name: path
      type:
          - string
      description: |
          Indexed vector type field to search.
    - name: queryVector
      type:
          - array
      description: |
          Array of numbers that represent the query vector. The number type must match the indexed field value type.
    - name: exact
      optional: true
      type:
          - bool
      description: |
          This is required if numCandidates is omitted. false to run ANN search. true to run ENN search.
    - name: filter
      optional: true
      type:
          - query
      description: |
          Any match query that compares an indexed field with a boolean, date, objectId, number (not decimals), string, or UUID to use as a pre-filter.
    - name: numCandidates
      optional: true
      type:
          - int
      description: |
          This field is required if exact is false or omitted.
          Number of nearest neighbors to use during the search. Value must be less than or equal to (<=) 10000. You can't specify a number less than the number of documents to return (limit).
tests:
    - name: ANN Basic
      link: https://www.mongodb.com/docs/atlas/atlas-vector-search/vector-search-stage/#ann-examples
      pipeline:
          - $vectorSearch:
                index: vector_index
                path: plot_embedding
                queryVector:
                    - -0.0016261312
                    - -0.028070757
                    - -0.011342932
                numCandidates: 150
                limit: 10
          - $project:
                _id: 0
                plot: 1
                title: 1
                score:
                    $meta: vectorSearchScore
      schema:
          TestCollection:
              plot:
                  types:
                      - bsonType: String
              title:
                  types:
                      - bsonType: String
              score:
                  types:
                      - bsonType: Number
    - name: ANN Filter
      link: https://www.mongodb.com/docs/atlas/atlas-vector-search/vector-search-stage/#ann-examples
      pipeline:
          - $vectorSearch:
                index: vector_index
                path: plot_embedding
                filter:
                    $and:
                        - year:
                              $lt: 1975
                queryVector:
                    - 0.02421053
                    - -0.022372592
                    - -0.006231137
                numCandidates: 150
                limit: 10
          - $project:
                _id: 0
                title: 1
                plot: 1
                year: 1
                score:
                    $meta: vectorSearchScore
      schema:
          movies:
              _id:
                  types:
                      - bsonType: Document
                        fields:
                            $oid:
                                types:
                                    - bsonType: String
              title:
                  types:
                      - bsonType: String
              year:
                  types:
                      - bsonType: Document
                        fields:
                            $numberInt:
                                types:
                                    - bsonType: String
              runtime:
                  types:
                      - bsonType: Document
                        fields:
                            $numberInt:
                                types:
                                    - bsonType: String
              released:
                  types:
                      - bsonType: Document
                        fields:
                            $date:
                                types:
                                    - bsonType: Document
                                      fields:
                                          $numberLong:
                                              types:
                                                  - bsonType: String
              poster:
                  types:
                      - bsonType: String
              plot:
                  types:
                      - bsonType: String
              fullplot:
                  types:
                      - bsonType: String
              lastupdated:
                  types:
                      - bsonType: String
              type:
                  types:
                      - bsonType: String
              directors:
                  types:
                      - bsonType: Array
                        types:
                            - bsonType: String
              imdb:
                  types:
                      - bsonType: Document
                        fields:
                            rating:
                                types:
                                    - bsonType: Document
                                      fields:
                                          $numberDouble:
                                              types:
                                                  - bsonType: String
                            votes:
                                types:
                                    - bsonType: Document
                                      fields:
                                          $numberInt:
                                              types:
                                                  - bsonType: String
                            id:
                                types:
                                    - bsonType: Document
                                      fields:
                                          $numberInt:
                                              types:
                                                  - bsonType: String
              cast:
                  types:
                      - bsonType: Array
                        types:
                            - bsonType: String
              countries:
                  types:
                      - bsonType: Array
                        types:
                            - bsonType: String
              genres:
                  types:
                      - bsonType: Array
                        types:
                            - bsonType: String
              tomatoes:
                  types:
                      - bsonType: Document
                        fields:
                            viewer:
                                types:
                                    - bsonType: Document
                                      fields:
                                          rating:
                                              types:
                                                  - bsonType: Document
                                                    fields:
                                                        $numberDouble:
                                                            types:
                                                                - bsonType: String
                                          numReviews:
                                              types:
                                                  - bsonType: Document
                                                    fields:
                                                        $numberInt:
                                                            types:
                                                                - bsonType: String
                            lastUpdated:
                                types:
                                    - bsonType: Document
                                      fields:
                                          $date:
                                              types:
                                                  - bsonType: Document
                                                    fields:
                                                        $numberLong:
                                                            types:
                                                                - bsonType: String
              num_mflix_comments:
                  types:
                      - bsonType: Document
                        fields:
                            $numberInt:
                                types:
                                    - bsonType: String
    - name: ENN
      link: https://www.mongodb.com/docs/atlas/atlas-vector-search/vector-search-stage/#enn-example
      pipeline:
          - $vectorSearch:
                index: vector_index
                path: plot_embedding
                queryVector:
                    - -0.006954097
                    - -0.009932499
                    - -0.001311474
                exact: true
                limit: 10
          - $project:
                _id: 0
                plot: 1
                title: 1
                score:
                    $meta: vectorSearchScore
      schema:
          TestCollection:
              plot:
                  types:
                      - bsonType: String
              title:
                  types:
                      - bsonType: String
              score:
                  types:
                      - bsonType: Number
