# $schema: ../schema.json
name: $gte
link: https://www.mongodb.com/docs/manual/reference/operator/query/gte/
type:
    - fieldQuery
encode: single
description: |
    Matches values that are greater than or equal to a specified value.
arguments:
    - name: value
      type:
          - any
tests:
    - name: Match Document Fields
      link: https://www.mongodb.com/docs/manual/reference/operator/query/gte/#match-document-fields
      pipeline:
          - $match:
                quantity:
                    $gte: 20
      schema:
          inventory:
              item:
                  types:
                      - bsonType: String
              quantity:
                  types:
                      - bsonType: Number
              carrier:
                  types:
                      - bsonType: Document
                        fields:
                            name:
                                types:
                                    - bsonType: String
                            fee:
                                types:
                                    - bsonType: Number
