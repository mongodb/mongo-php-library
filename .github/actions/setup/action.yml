name: Setup
description: Sets up the build environment
inputs:
  php-version:
    description: "PHP version to install"
    required: true
  driver-version:
    description: "MongoDB extension version to install: \"stable\" for the highest version allowed by composer.json, \"lowest\" for the minimum required version"
    required: false
    default: "stable"
  php-ini-values:
    description: "INI values to pass along to setup-php action"
    required: false
    default: ""
  working-directory:
    description: "The directory where composer.json is located, if it is not in the repository root."
    required: false
  ignore-platform-req:
    description: "Whether to ignore platform requirements when installing dependencies with Composer."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve extension version
      id: driver
      shell: bash
      # Set EXTENSION_DEV_BRANCH to a branch name (e.g. "v2.x") to build the
      # extension from source while the library depends on an unreleased
      # version. This also overrides the "lowest" version. Reset it to an empty
      # value once the extension is released. See the "Continuous integration"
      # section of CONTRIBUTING.md.
      run: |
        EXTENSION_DEV_BRANCH=""
        # EXTENSION_DEV_BRANCH="v2.x"

        if [ -n "$EXTENSION_DEV_BRANCH" ]; then
          # Source builds cannot be cached, and caching a moving branch under a
          # stable key would freeze an outdated extension.
          echo "version=mongodb/mongo-php-driver@${EXTENSION_DEV_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "cacheable=false" >> "$GITHUB_OUTPUT"
        elif [ "${{ inputs.driver-version }}" = "lowest" ]; then
          CONSTRAINT=$(jq -er '.require["ext-mongodb"]' composer.json)
          VERSION=${CONSTRAINT#^}
          case "$VERSION" in
            *.*.*) ;;
            *) VERSION="${VERSION}.0" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "cacheable=true" >> "$GITHUB_OUTPUT"
        else
          echo "version=${{ inputs.driver-version }}" >> "$GITHUB_OUTPUT"
          echo "cacheable=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup cache environment
      id: extcache
      if: steps.driver.outputs.cacheable == 'true'
      uses: shivammathur/cache-extensions@v1
      with:
        php-version: ${{ inputs.php-version }}
        extensions: "mongodb-${{ steps.driver.outputs.version }}"
        key: "extcache-${{ steps.driver.outputs.version }}-${{ hashFiles('composer.json') }}"

    - name: Cache extensions
      if: steps.driver.outputs.cacheable == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.extcache.outputs.dir }}
        key: ${{ steps.extcache.outputs.key }}
        restore-keys: ${{ steps.extcache.outputs.key }}

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        coverage: xdebug
        extensions: "mongodb-${{ steps.driver.outputs.version }}"
        php-version: "${{ inputs.php-version }}"
        tools: cs2pr
        ini-values: "${{ inputs.php-ini-values }}"

    - name: Show driver information
      run: "php --ri mongodb"
      shell: bash

    - name: Check the expected driver version is installed
      if: inputs.driver-version == 'lowest'
      shell: bash
      run: |
        INSTALLED=$(php -r 'echo phpversion("mongodb");')
        EXPECTED="${{ steps.driver.outputs.version }}"

        if [ "$INSTALLED" != "$EXPECTED" ]; then
          echo "::error::Expected extension version $EXPECTED, got $INSTALLED"
          exit 1
        fi

    - name: Install dependencies with Composer
      uses: ramsey/composer-install@3.0.0
      with:
        composer-options: "--no-suggest ${{ inputs.ignore-platform-req == 'true' && '--ignore-platform-req=php+' || '' }}"
        working-directory: "${{ inputs.working-directory }}"
