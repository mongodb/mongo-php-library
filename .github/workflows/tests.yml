name: "Tests"

on:
  merge_group:
  pull_request:
    branches:
      - "v*.*"
      - "feature/*"
  push:
    branches:
      - "v*.*"
      - "feature/*"

env:
  DRIVER_VERSION: "mongodb/mongo-php-driver@v1.21"

jobs:
  phpunit:
    name: "PHPUnit tests"
    runs-on: "${{ matrix.os }}"

    strategy:
      fail-fast: true
      matrix:
        os:
          - "ubuntu-22.04"
        php-version:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
        mongodb-version:
          - "6.0"
        topology:
          - "server"
        include:
          - os: "ubuntu-22.04"
            php-version: "8.1"
            mongodb-version: "6.0"
            topology: "replica_set"
          - os: "ubuntu-22.04"
            php-version: "8.1"
            mongodb-version: "6.0"
            topology: "sharded_cluster"
          - os: "ubuntu-24.04"
            php-version: "8.1"
            mongodb-version: "8.0"
            topology: "server"
          - os: "ubuntu-24.04"
            php-version: "8.1"
            mongodb-version: "8.0"
            topology: "replica_set"
          - os: "ubuntu-24.04"
            php-version: "8.1"
            mongodb-version: "8.0"
            topology: "sharded_cluster"

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: "Setup MongoDB"
        id: setup-mongodb
        uses: ./tests/drivers-evergreen-tools
        with:
          version: ${{ matrix.mongodb-version }}
          topology: ${{ matrix.topology }}

      - name: "Setup PHP"
        uses: ./.github/actions/setup
        with:
          php-version: ${{ matrix.php-version }}
          driver-version: ${{ env.DRIVER_VERSION }}
          php-ini-values: "zend.assertions=1"

      - name: "Run PHPUnit"
        run: "vendor/bin/phpunit"
        env:
          MONGODB_URI: ${{ steps.setup-mongodb.outputs.cluster-uri }}
