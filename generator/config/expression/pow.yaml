# $schema: ../schema.json
name: $pow
link: https://www.mongodb.com/docs/manual/reference/operator/aggregation/pow/
type:
    - resolvesToNumber
encode: array
description: |
    Raises a number to the specified exponent.
arguments:
    - name: number
      type:
          - resolvesToNumber
    - name: exponent
      type:
          - resolvesToNumber
tests:
    - name: Example
      link: https://www.mongodb.com/docs/manual/reference/operator/aggregation/pow/#example
      pipeline:
          - $project:
                variance:
                    $pow:
                        - $stdDevPop:
                              - $scores.score
                        - 2
      schema:
          quizzes:
              _id:
                  types:
                      - bsonType: Number
              scores:
                  types:
                      - bsonType: Array
                        types:
                            - bsonType: Document
                              fields:
                                  name:
                                      types:
                                          - bsonType: String
                                  score:
                                      types:
                                          - bsonType: Number
                                  quiz:
                                      types:
                                          - bsonType: Number
